# nRF Connect SDK / Zephyr configuration. Each block is a decision.

CONFIG_MAIN_STACK_SIZE=4096

# --- LTE ----------------------------------------------------------------
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M=y
# NB-IoT is deliberately not enabled as a fallback. It has better coverage but
# a 10x worse latency budget, and a modem that silently falls back changes the
# energy budget by an order of magnitude without telling anyone. If a site needs
# NB-IoT, that is a deployment decision recorded per device, not a runtime one.
CONFIG_LTE_NETWORK_USE_FALLBACK=n

# PSM: stay registered but asleep, so a transmission costs an RRC connection
# (95 mA.s) rather than a full attach (~1000 mA.s). The requested active time is
# short because the node has nothing to receive between acquisitions; the TAU is
# long because re-attaching is the expensive event.
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_RPTAU="00101010"   # ~10.5 hours
CONFIG_LTE_PSM_REQ_RAT="00000000"     # 0 s active time after a transaction

# eDRX off. With PSM configured as above the node is unreachable between
# transmissions by design, and eDRX would only add paging opportunities it does
# not use -- at the cost of waking the modem receiver periodically.
CONFIG_LTE_EDRX_REQ=n

# --- transport ----------------------------------------------------------
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MODEM_KEY_MGMT=y
# Per-device certificates in the modem's own key store, so the private key never
# appears in application flash or RAM. This is the strongest key custody
# available on any kit in this repository. See docs/04_security.md.

# --- storage ------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- sensor bus ---------------------------------------------------------
CONFIG_SPI=y
CONFIG_SPI_NRFX=y
CONFIG_ADC=y
CONFIG_SENSOR=y

# --- power --------------------------------------------------------------
CONFIG_PM=y
CONFIG_PM_DEVICE=y
# System OFF is not used: it loses RAM and, more importantly, loses the modem's
# registration, so the next transmission pays a full attach. The ~3 uA floor
# with the modem in PSM is already low enough that the cell's self-discharge
# (4 uA) is comparable.

# --- bootloader ---------------------------------------------------------
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
# A/B with rollback. Non-negotiable on a kit whose whole point is that nobody
# visits the site: a bad image with no rollback is a truck roll, and on a remote
# asset that can be a helicopter.

# --- floating point -----------------------------------------------------
CONFIG_FPU=y
CONFIG_FP16=n
# Single-precision only on the M33. The build adds -Wdouble-promotion via
# CMakeLists; Zephyr does not include it by default.

# --- diagnostics --------------------------------------------------------
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=2
# Deferred logging: a synchronous log write during an acquisition blocks for
# milliseconds and overruns the sensor FIFO. This is the same hazard the
# ESP32-S3 branch solves with core pinning.

# --- heap ---------------------------------------------------------------
CONFIG_HEAP_MEM_POOL_SIZE=2048
# Small on purpose. The application allocates nothing; the modem library and the
# TLS stack have their own pools. A large heap here would only hide a leak.
