version: "3.9"

# ---------------------------------------------------------------------------
# Analytics stack: Apache Superset + Redis + Celery + VictoriaMetrics
# ---------------------------------------------------------------------------
# Superset UI:       http://localhost:8088   (admin / admin in dev)
# VictoriaMetrics:   http://localhost:8428
# ---------------------------------------------------------------------------

x-superset-env: &superset-env
  SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:-change-me-in-production-32-chars}"
  DATABASE_URL: "postgresql+psycopg2://superset:superset@postgres:5432/superset"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis:6379/2"
  SUPERSET_CONFIG_PATH: "/app/pythonpath/superset_config.py"
  PYTHONPATH: "/app/pythonpath"
  # Application database (alerts, work orders, assets) — read-only from Superset
  APP_DB_URL: "${APP_DB_URL:-postgresql+psycopg2://app_ro:app_ro@postgres:5432/maintenance}"

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — Superset metadata store (charts, dashboards, users)
  # In production this should be a separate RDS/CloudSQL instance.
  # The application's maintenance DB (alerts, work orders) lives on a
  # different database (maintenance) within the same host for dev convenience.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init_app_db.sql:/docker-entrypoint-initdb.d/01_app_db.sql:ro
    networks:
      - analytics-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — Superset cache + Celery broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - analytics-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Apache Superset — BI / analytics UI
  # ---------------------------------------------------------------------------
  superset:
    image: apache/superset:3.1.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    ports:
      - "8088:8088"
    environment:
      <<: *superset-env
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    networks:
      - analytics-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Celery worker — async reports, scheduled email snapshots, alert checks
  # ---------------------------------------------------------------------------
  celery-worker:
    image: apache/superset:3.1.3
    restart: unless-stopped
    command: celery --app=superset.tasks.celery_app:app worker --loglevel=info -Q default,email_reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    environment:
      <<: *superset-env
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    networks:
      - analytics-net

  # ---------------------------------------------------------------------------
  # Celery beat — scheduler for periodic tasks (thumbnail generation, reports)
  # ---------------------------------------------------------------------------
  celery-beat:
    image: apache/superset:3.1.3
    restart: unless-stopped
    command: celery --app=superset.tasks.celery_app:app beat --loglevel=info --schedule=/app/superset_home/celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    environment:
      <<: *superset-env
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    networks:
      - analytics-net

  # ---------------------------------------------------------------------------
  # Superset init — one-shot container: DB migration + admin + dashboard import
  # ---------------------------------------------------------------------------
  superset-init:
    image: apache/superset:3.1.3
    restart: "no"
    command: ["/bin/sh", "/app/init/import_dashboards.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *superset-env
      ADMIN_USERNAME: "${SUPERSET_ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${SUPERSET_ADMIN_PASSWORD:-admin}"
      ADMIN_EMAIL: "${SUPERSET_ADMIN_EMAIL:-admin@example.com}"
      SUPERSET_BASE_URL: "http://localhost:8088"
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./init:/app/init:ro
      - ./dashboards:/app/dashboards:ro
      - ./datasources:/app/datasources:ro
      - superset_home:/app/superset_home
    networks:
      - analytics-net

  # ---------------------------------------------------------------------------
  # VictoriaMetrics — time-series database for sensor metrics
  # In production this is an existing VM cluster; here we run a single-node
  # instance for development and integration testing.
  # ---------------------------------------------------------------------------
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.99.0
    restart: unless-stopped
    ports:
      - "8428:8428"
    command:
      - "--storageDataPath=/storage"
      - "--retentionPeriod=12"          # 12 months retention
      - "--httpListenAddr=:8428"
      - "--search.maxQueryLen=16384"
      - "--search.maxPointsPerTimeseries=100000"
    volumes:
      - victoriametrics_data:/storage
    networks:
      - analytics-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8428/health"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  analytics-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  superset_home:
  victoriametrics_data:
