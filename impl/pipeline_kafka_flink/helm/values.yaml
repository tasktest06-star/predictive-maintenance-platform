# ──────────────────────────────────────────────────────────────────────────────
# Helm Chart Values — PDM Kafka + Flink Pipeline
# Production Kubernetes deployment
#
# Usage:
#   helm repo add bitnami https://charts.bitnami.com/bitnami
#   helm repo add flink-operator https://downloads.apache.org/flink/flink-kubernetes-operator-*
#   helm install pdm-kafka bitnami/kafka -f values.yaml
# ──────────────────────────────────────────────────────────────────────────────

# ════════════════════════════════════════════════════════════════════════════
# Global
# ════════════════════════════════════════════════════════════════════════════
global:
  imageRegistry: ""
  storageClass: "fast-ssd"   # Replace with your cloud provider's fast SSD StorageClass
  namespaceOverride: "pdm-pipeline"

# ════════════════════════════════════════════════════════════════════════════
# Apache Kafka (via bitnami/kafka chart)
# ════════════════════════════════════════════════════════════════════════════
kafka:
  replicaCount: 3

  kraft:
    enabled: false          # Use ZooKeeper for compatibility with HiveMQ extension

  zookeeper:
    replicaCount: 3
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "fast-ssd"
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

  persistence:
    enabled: true
    size: 500Gi
    storageClass: "fast-ssd"

  resources:
    requests:
      cpu: "2"
      memory: "6Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

  heapOpts: "-Xmx4g -Xms4g"

  config:
    auto.create.topics.enable: "false"
    delete.topic.enable: "true"
    default.replication.factor: "3"
    min.insync.replicas: "2"
    offsets.topic.replication.factor: "3"
    transaction.state.log.replication.factor: "3"
    transaction.state.log.min.isr: "2"
    log.retention.hours: "168"
    log.segment.bytes: "1073741824"
    compression.type: "lz4"
    num.network.threads: "8"
    num.io.threads: "16"
    socket.send.buffer.bytes: "102400"
    socket.receive.buffer.bytes: "102400"
    socket.request.max.bytes: "268435456"
    unclean.leader.election.enable: "false"
    # JMX for monitoring
    jmx.port: "9999"

  metrics:
    jmx:
      enabled: true
    kafka:
      enabled: true
    serviceMonitor:
      enabled: true    # Requires Prometheus Operator CRD

  auth:
    interBrokerProtocol: tls
    clientProtocol: tls
    tls:
      type: jks
      existingSecrets:
        - kafka-tls-secret-broker-0
        - kafka-tls-secret-broker-1
        - kafka-tls-secret-broker-2

  podDisruptionBudget:
    create: true
    minAvailable: 2

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: "app.kubernetes.io/name"
                operator: In
                values: ["kafka"]
          topologyKey: "kubernetes.io/hostname"

# ════════════════════════════════════════════════════════════════════════════
# HiveMQ CE (custom deployment — no official Helm chart in bitnami)
# ════════════════════════════════════════════════════════════════════════════
hivemq:
  enabled: true
  image:
    repository: hivemq/hivemq-ce
    tag: "latest"
    pullPolicy: IfNotPresent

  replicaCount: 3   # Cluster mode

  service:
    type: LoadBalancer
    mqttPort: 1883
    mqttTlsPort: 8883
    webUiPort: 8080
    annotations:
      # AWS NLB for low-latency MQTT connections
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

  resources:
    requests:
      cpu: "2"
      memory: "3Gi"
    limits:
      cpu: "4"
      memory: "4Gi"

  javaOpts: "-Xmx3g -Xms2g"

  env:
    HIVEMQ_MAX_CONCURRENT_CONNECTIONS: "50000"
    HIVEMQ_KEEP_ALIVE: "60"

  persistence:
    enabled: true
    size: 50Gi
    storageClass: "fast-ssd"

  tls:
    enabled: true
    secretName: hivemq-tls-secret
    requireClientCert: true   # mTLS

  podDisruptionBudget:
    create: true
    minAvailable: 2

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values: ["hivemq"]
            topologyKey: "kubernetes.io/hostname"

# ════════════════════════════════════════════════════════════════════════════
# Apache Flink (via flink-kubernetes-operator)
# ════════════════════════════════════════════════════════════════════════════
flink:
  enabled: true

  image:
    repository: flink
    tag: "1.18-scala_2.12-java17"
    pullPolicy: IfNotPresent

  jobManager:
    replicaCount: 1
    resource:
      memory: "2048m"
      cpu: 1
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "3Gi"
    podTemplate:
      spec:
        nodeSelector:
          node-role: "flink-control"

  taskManager:
    replicaCount: 3
    resource:
      memory: "4096m"
      cpu: 2
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "4"
        memory: "6Gi"
    podTemplate:
      spec:
        nodeSelector:
          node-role: "flink-worker"

  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "4"
    state.backend: "rocksdb"
    state.backend.rocksdb.memory.managed: "true"
    state.checkpoints.dir: "s3://pdm-flink-checkpoints/checkpoints"
    state.savepoints.dir: "s3://pdm-flink-checkpoints/savepoints"
    execution.checkpointing.interval: "30000"
    execution.checkpointing.mode: "EXACTLY_ONCE"
    execution.checkpointing.min-pause: "10000"
    execution.checkpointing.timeout: "60000"
    high-availability: "zookeeper"
    high-availability.zookeeper.quorum: "zookeeper:2181"
    high-availability.zookeeper.path.root: "/flink/pdm"
    high-availability.storageDir: "s3://pdm-flink-checkpoints/ha"
    metrics.reporter.prom.factory.class: "org.apache.flink.metrics.prometheus.PrometheusReporterFactory"
    metrics.reporter.prom.port: "9249"
    parallelism.default: "12"   # 3 TMs x 4 slots

  ingress:
    enabled: true
    ingressClassName: "nginx"
    hosts:
      - host: flink.pdm.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: flink-tls-secret
        hosts:
          - flink.pdm.internal

  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/pdm-flink-s3-role"

# ════════════════════════════════════════════════════════════════════════════
# VictoriaMetrics Cluster Mode
# (vminsert → vmstorage → vmselect)
# ════════════════════════════════════════════════════════════════════════════
victoriametrics:
  enabled: true

  # vminsert — receives writes from Flink, Kafka exporters, etc.
  vminsert:
    replicaCount: 2
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "1Gi"
    extraArgs:
      maxInsertRequestSize: "67108864"    # 64 MB
      replicationFactor: "2"

  # vmstorage — stores time-series data on persistent volumes
  vmstorage:
    replicaCount: 3
    retentionPeriod: "90d"
    persistence:
      enabled: true
      size: 1Ti
      storageClass: "fast-ssd"
    resources:
      requests:
        cpu: "2"
        memory: "8Gi"
      limits:
        cpu: "4"
        memory: "16Gi"
    extraArgs:
      dedup.minScrapeInterval: "15s"    # Deduplicate scrapes from replicated collectors
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values: ["vmstorage"]
            topologyKey: "kubernetes.io/hostname"

  # vmselect — query frontend (PromQL-compatible)
  vmselect:
    replicaCount: 2
    resources:
      requests:
        cpu: "1"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "2Gi"
    extraArgs:
      search.maxQueryDuration: "60s"
      search.maxUniqueTimeseries: "1000000"
      search.cacheTimestampOffset: "5m"

  ingress:
    enabled: true
    ingressClassName: "nginx"
    hosts:
      - host: metrics.pdm.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: victoriametrics-tls-secret
        hosts:
          - metrics.pdm.internal

# ════════════════════════════════════════════════════════════════════════════
# Grafana
# ════════════════════════════════════════════════════════════════════════════
grafana:
  enabled: true
  replicaCount: 2

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

  persistence:
    enabled: true
    size: 10Gi

  adminUser: admin
  adminPassword: ""   # Set via secret: grafana-admin-secret

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          type: prometheus
          url: http://vmselect-pdm:8481/select/0/prometheus
          access: proxy
          isDefault: true
          jsonData:
            timeInterval: "15s"

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "pdm-dashboards"
          orgId: 1
          folder: "PDM Platform"
          type: file
          options:
            path: /var/lib/grafana/dashboards/pdm

  ingress:
    enabled: true
    ingressClassName: "nginx"
    hosts:
      - grafana.pdm.internal
    tls:
      - secretName: grafana-tls-secret
        hosts:
          - grafana.pdm.internal

# ════════════════════════════════════════════════════════════════════════════
# PostgreSQL (bitnami/postgresql)
# Alert state machine, device registry, waveform metadata index
# ════════════════════════════════════════════════════════════════════════════
postgresql:
  enabled: true
  auth:
    database: pdm
    username: pdm
    existingSecret: postgresql-credentials
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: pdm-password

  primary:
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    persistence:
      enabled: true
      size: 100Gi
      storageClass: "fast-ssd"
    configuration: |
      max_connections = 200
      shared_buffers = 1GB
      work_mem = 16MB
      maintenance_work_mem = 256MB
      effective_cache_size = 3GB
      wal_level = replica
      archive_mode = on

  readReplicas:
    replicaCount: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
    persistence:
      size: 100Gi

# ════════════════════════════════════════════════════════════════════════════
# Ingress Controller (shared)
# ════════════════════════════════════════════════════════════════════════════
ingress:
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "256m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

# ════════════════════════════════════════════════════════════════════════════
# Network Policies
# ════════════════════════════════════════════════════════════════════════════
networkPolicy:
  enabled: true
  # Allow only known components to reach Kafka
  kafka:
    allowFrom:
      - podSelector:
          matchLabels:
            app: hivemq
      - podSelector:
          matchLabels:
            app: flink
      - podSelector:
          matchLabels:
            app: kafka-exporter
