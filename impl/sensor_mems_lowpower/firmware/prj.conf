# prj.conf — Zephyr project configuration
# MEMS Low-Power Sensor (STM32U5 / nucleo_u575zi_q)
# Zephyr RTOS 3.6
#
# Design principle: enable only what is needed, disable everything else.
# Every enabled subsystem costs Flash, SRAM, and potentially current draw.
# This configuration is optimized for a battery-powered sensor with
# ≥8-year life target.

# ── Core kernel ─────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=1024

# ── CPU / architecture ───────────────────────────────────────────────────────
CONFIG_ARM_MPU=y
# TrustZone: run application in Non-Secure world.
# Secure world holds device private key and does TLS handshake.
CONFIG_TRUSTED_EXECUTION_NONSECURE=y

# ── Peripherals required ─────────────────────────────────────────────────────
CONFIG_SPI=y
CONFIG_SPI_ASYNC=y          # Enable async SPI for DMA-backed transfers
CONFIG_I2C=n                # No I2C peripherals in this design
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y

# ── BLE 5.2 ─────────────────────────────────────────────────────────────────
# BLE is used for initial commissioning and direct smartphone connection.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MEMS-Sensor"
CONFIG_BT_DEVICE_APPEARANCE=0x0180  # Generic Sensor
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=n
# Disable unused BLE features
CONFIG_BT_CENTRAL=n
CONFIG_BT_OBSERVER=n
CONFIG_BT_BROADCASTER=n

# ── MQTT (used for Sub-GHz gateway uplink via CC1352P) ──────────────────────
CONFIG_MQTT_LIB=y
CONFIG_MQTT_KEEPALIVE=60
CONFIG_MQTT_CLEAN_SESSION=y

# ── Networking (minimal — no TCP stack needed; CC1352P handles radio) ────────
CONFIG_NETWORKING=n         # Full Zephyr networking stack not needed on STM32U5;
                            # CC1352P handles the Sub-GHz PHY and TCP/IP offload.

# ── Power management ─────────────────────────────────────────────────────────
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_POWEROFF=y
# Allow STOP2 (sub-state 2) — 300 nA, RAM retained
CONFIG_PM_S2RAM=y

# ── Clock control ────────────────────────────────────────────────────────────
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_STM32_CUBE=y

# ── GPIO / EXTI ──────────────────────────────────────────────────────────────
CONFIG_GPIO=y

# ── DMA ──────────────────────────────────────────────────────────────────────
CONFIG_DMA=y
CONFIG_DMA_STM32=y

# ── CMSIS-DSP ────────────────────────────────────────────────────────────────
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y    # FIR/IIR filters
CONFIG_CMSIS_DSP_STATISTICS=y   # arm_mean_f32, arm_var_f32, arm_rms_f32
CONFIG_CMSIS_DSP_TRANSFORM=y    # arm_rfft_fast_f32
CONFIG_CMSIS_DSP_COMPLEXMATH=y  # arm_cmplx_mag_f32
CONFIG_CMSIS_DSP_FASTMATH=y     # arm_cos_f32, fast approximations
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ── CBOR encoding (TinyCBOR) ─────────────────────────────────────────────────
CONFIG_TINYCBOR=y

# ── Logging ──────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y      # Deferred logging reduces ISR latency
CONFIG_LOG_BUFFER_SIZE=1024
CONFIG_LOG_BACKEND_UART=y
# In production builds, set CONFIG_LOG_DEFAULT_LEVEL=0 to eliminate log overhead
CONFIG_LOG_DEFAULT_LEVEL=3      # INFO in development; set to 0 for production

# ── Assertions ───────────────────────────────────────────────────────────────
CONFIG_ASSERT=y                 # Disable in production for slight speed gain

# ── Explicitly disabled subsystems ───────────────────────────────────────────
# These are off by default in Zephyr but listed here for documentation purposes.
CONFIG_SHELL=n
CONFIG_FILE_SYSTEM=n
CONFIG_FAT_FILESYSTEM_ELM=n
CONFIG_LITTLEFS=n
CONFIG_POSIX_API=n
CONFIG_PTHREAD_IPC=n
CONFIG_EVENTFD=n
CONFIG_SETTINGS=n               # No NVS settings store needed
CONFIG_NVS=n
CONFIG_FLASH=n                  # No local flash read/write needed
CONFIG_CONSOLE=n                # UART0 used for CC1352 UART, not console
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_CAN=n
CONFIG_ETH=n
CONFIG_WIFI=n
CONFIG_SENSOR=n                 # Not using Zephyr sensor subsystem (raw SPI driver)
CONFIG_SENSOR_SHELL=n
CONFIG_CBPRINTF_FP_SUPPORT=y    # Allow %f in LOG_INF for float values during debug
