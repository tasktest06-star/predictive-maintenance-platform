# Mosquitto configuration for the sensor fleet.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type error
log_type notice

# Plain MQTT on the plant LAN. Devices on a routed or cellular path must use
# 8883; see the TLS listener below.
listener 1883
# Anonymous is acceptable ONLY on an isolated sensor VLAN. Any other topology
# needs the password file (see cloud/README.md § securing the broker) -- an open
# broker on a flat plant network lets anyone publish a fabricated alarm, which is
# a safety problem, not just a security one.
allow_anonymous true

# TLS listener for cellular and gateway-to-cloud links. Certificates are mounted
# by the deployment; the listener stays commented out until they exist, because a
# broker that fails to start is a worse outage than one without TLS on the LAN.
#listener 8883
#cafile   /mosquitto/certs/ca.crt
#certfile /mosquitto/certs/server.crt
#keyfile  /mosquitto/certs/server.key
#require_certificate true
#use_identity_as_username true

# A 300-byte frame per sensor per hour is tiny; the limits here exist to bound
# the damage from a malfunctioning or hostile device rather than to shape normal
# traffic.
message_size_limit 65536
max_inflight_messages 40
max_queued_messages 10000
max_connections 5000

# Devices that publish faster than once per 10 s are misconfigured or faulty.
# Keepalive is generous because a battery sensor sleeps between acquisitions.
keepalive_interval 300
