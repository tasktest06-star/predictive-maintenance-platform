[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "predictive-maintenance"
version = "0.1.0"
requires-python = ">=3.11"
description = "Predictive maintenance platform — multiple implementation methods"

[project.optional-dependencies]
classical = [
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "joblib>=1.4",
    "xgboost>=2.0",
]
deep-learning = [
    "torch>=2.3",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "scipy>=1.12",
]
streaming = [
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "asyncio-mqtt>=0.16",
    "aioredis>=2.0",
    "scipy>=1.12",
]
llm-augmented = [
    "anthropic>=0.28",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "joblib>=1.4",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
